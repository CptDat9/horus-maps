# Alembic config for the Horus Maps *application* schema (public.*).
# The DB URL is NOT set here — migrations/env.py derives it from PostgresConfig
# (env vars), so the same config works for local, Docker, and prod.
#
# The PgSTAC catalog (pgstac.*) is owned by pypgstac / stac-fastapi-pgstac and is
# intentionally excluded from autogenerate (see env.py: _include_object).

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# Versioned, sortable filenames: 0001_initial.py, 0002_add_x.py, ...
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
