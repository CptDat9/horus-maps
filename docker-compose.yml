name: horus-maps

# Toàn bộ hệ thống (frontend + api + worker + hạ tầng):
#   Chạy lệnh: docker compose up -d --build
#   Giao diện App → http://localhost:3000 , API → http://localhost:8000
#   Giao diện quản lý RabbitMQ → http://localhost:15672 (tài khoản: admin/admin)
#
services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: horus-maps-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: horus_maps
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d horus_maps"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: horus-maps-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: horus-maps-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    # Giữ cho api/worker không khởi động trước khi RabbitMQ thực sự sẵn sàng.
    # Nếu không có cấu hình này, các ứng dụng sẽ tranh chấp quyền khởi động với broker
    # và lượt kết nối đầu tiên sẽ bị lỗi ("Connect call failed … 5672").
    # Lệnh `check_port_connectivity` sẽ đợi cho đến khi cổng AMQP (5672) thực sự chấp nhận kết nối;
    # trong khi lệnh `ping` thông thường sẽ báo trạng thái "healthy" (khỏe mạnh) hơi sớm một chút.
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  titiler:
    image: ghcr.io/developmentseed/titiler:latest
    container_name: horus-maps-titiler
    restart: unless-stopped
    ports:
      - "8081:80"   # Cổng 80 là cổng mặc định gunicorn của image này lắng nghe
    environment:
      # Các cấu hình GDAL để đọc bộ lưu trữ (bucket) Sentinel-2 COG công khai ẩn danh (không cần deploy AWS).
      - AWS_NO_SIGN_REQUEST=YES
      - AWS_REGION=us-west-2
      - GDAL_DISABLE_READDIR_ON_OPEN=EMPTY_DIR
      - CPL_VSIL_CURL_ALLOWED_EXTENSIONS=.tif,.TIF,.tiff
      - GDAL_HTTP_MERGE_CONSECUTIVE_RANGES=YES
      - GDAL_HTTP_MULTIPLEX=YES
      - GDAL_HTTP_VERSION=2
      - GDAL_BAND_BLOCK_CACHE=HASHSET
      - CPL_TMP=/tmp
      # ---- Tốc độ đọc COG từ S3 (Giải pháp sửa lỗi quá hạn - ReadTimeout khi tải tile) ----
      # Kích thước bộ nhớ đệm (Cache) được tính TRÊN MỖI WORKER, vì vậy N workers sẽ nhân số lượng này lên.
      # Trên một máy chủ nhỏ (máy dev này có khoảng ~4 GB RAM), mức cấu hình cũ là 512 MB × 6 worker
      # đã làm cạn kiệt RAM và kích hoạt lỗi WORKER TIMEOUT của gunicorn → Gây ra lỗi "Read failed" / lỗi tile RemoteProtocolError.
      - GDAL_CACHEMAX=128                        # Bộ nhớ đệm block (MB) trên mỗi worker
      - VSI_CACHE=TRUE
      - VSI_CACHE_SIZE=134217728                # 128 MB bộ nhớ đệm curl cho mỗi file
      - CPL_VSIL_CURL_CACHE_SIZE=134217728
      - GDAL_INGESTED_BYTES_AT_OPEN=32768        # Đọc dữ liệu header của COG ngay trong một request range
      - GDAL_HTTP_MAX_RETRY=5
      - GDAL_HTTP_RETRY_DELAY=1
      - GDAL_HTTP_TIMEOUT=30
      # Quá trình đọc S3 COG chậm không được phép làm kích hoạt bộ giới hạn thời gian (timeout) 30 giây mặc định của gunicorn worker 
      # một worker bị tắt (killed) sẽ làm ngắt kết nối socket → gây ra lỗi RemoteProtocolError ở phía API.
      - GUNICORN_CMD_ARGS=--timeout 120 --graceful-timeout 30
      # Số lượng Worker: Vừa đủ để che giấu độ trễ của S3, nhưng cũng đủ ít để không bị tràn RAM.
      # Con số 4 phù hợp cho máy cấu hình ~4 GB RAM; tăng lên nếu máy mạnh hơn, giảm xuống nếu RAM bị bó hẹp.
      - WEB_CONCURRENCY=4

  # Khởi chạy STAC API đúng chuẩn (stac-fastapi-pgstac) dựa trên schema PgSTAC nằm trong Postgres dùng chung.
  # Tái sử dụng image backend; câu lệnh (command) dưới đây thực hiện cài đặt/cập nhật schema PgSTAC 
  # (idempotent - không ảnh hưởng dữ liệu cũ khi chạy lại) trước khi chạy service.
  # API chính sẽ proxy các request dạng `/api/stac/*` qua đây, và đường dẫn tile sẽ truy vấn trực tiếp vào PgSTAC này.
  stac:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: horus-maps-stac
    restart: unless-stopped
    command: >
      sh -c "pypgstac migrate --dsn postgresql://postgres:postgres@postgres:5432/horus_maps &&
             uvicorn app.stac.app:app --host 0.0.0.0 --port 8080"
    environment:
      # stac-fastapi-pgstac reader/writer pool
      POSTGRES_USER: postgres
      POSTGRES_PASS: postgres
      POSTGRES_DBNAME: horus_maps
      POSTGRES_HOST_READER: postgres
      POSTGRES_HOST_WRITER: postgres
      POSTGRES_PORT: 5432
      # Dùng cho các script như `scripts/ingest_sentinel.py` (Cấu hình PostgresConfig của app) để kết nối tới DB
      POSTGRES_HOST: postgres 
      STAC_FASTAPI_TITLE: Horus Maps STAC API
      STAC_FASTAPI_DESCRIPTION: Sentinel-2 catalogue (PgSTAC) for Horus Maps
    # Môi trường Dev: Mount trực tiếp code từ máy vật lý (host) để khi chạy lại script nạp dữ liệu (docker compose exec)
    # nó sẽ nhận code mới sửa ngay mà không cần build lại image. 
    # Nếu sửa phần logic chạy app (served app), bạn cần chạy lệnh `docker compose restart stac`.
    # Cách này an toàn ở đây vì STAC không chứa các file trọng số mô hình nặng (model weights).
    volumes:
      - ./backend:/app
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: horus-maps-api
    restart: unless-stopped
    env_file: .env
    environment: &app_env
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      RABBITMQ_URL: amqp://admin:admin@rabbitmq:5672/
      TITILER_URL: http://titiler:80              # server-side proxy
      TITILER_PUBLIC_URL: http://localhost:8081   # Phía trình duyệt gọi trực tiếp (để so sánh tile)
      STAC_API_URL: http://stac:8080              # Địa chỉ đích để proxy các request `/api/stac/*`
      DETECTION_OUTPUT_DIR: /app/static/detections # Thư mục chia sẻ chung với worker thông qua volume
    ports:
      - "8000:8000"
    volumes:
      - detection_data:/app/static/detections
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      stac:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: horus-maps-worker
    restart: unless-stopped
    command: python -m app.workers.task_worker
    env_file: .env
    environment: *app_env
    volumes:
      - detection_data:/app/static/detections
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: horus-maps-frontend
    restart: unless-stopped
    ports:
      - "3000:80"   # open http://localhost:3000
    depends_on:
      - api

volumes:
  postgres_data:
  detection_data:
